<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sistem Informasi Pembukuan Dana BOSP - SMP Negeri 1 Tulang Bawang Barat" />
    <meta name="theme-color" content="#1e40af" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    
    <!-- Content Security Policy - Izinkan eval untuk library Excel/Word -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob:;
      script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net;
      style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net;
      img-src 'self' data: blob: https:;
      font-src 'self' data: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net;
      connect-src 'self' https: http:;
      worker-src 'self' blob:;
    " />
    
    <title>Sistem Pembukuan BOSP - SMP Negeri 1 Tulang Bawang Barat</title>
    
    <!-- Font Awesome dengan fallback -->
    <link 
      rel="stylesheet" 
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" 
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
      onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css';"
    />
    
    <!-- Fallback jika kedua CDN gagal - gunakan emoji sebagai pengganti ikon -->
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
      body { 
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      #root { min-height: 100vh; }
      
      /* Loading spinner */
      .app-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        flex-direction: column;
        gap: 16px;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }
      .app-loading .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #e5e7eb;
        border-top-color: #2563eb;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .app-loading p { color: #6b7280; font-size: 14px; }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Loading indicator sebelum React dimuat -->
      <div class="app-loading">
        <div class="spinner"></div>
        <p>Memuat Sistem Pembukuan BOSP...</p>
      </div>
    </div>
    
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Fallback script jika module gagal dimuat -->
    <script nomodule>
      document.getElementById('root').innerHTML = 
        '<div style="font-family:sans-serif;max-width:500px;margin:50px auto;padding:20px;text-align:center;">' +
        '<h2 style="color:#dc2626;">Browser Tidak Didukung</h2>' +
        '<p style="color:#666;">Silakan gunakan browser modern seperti Chrome, Firefox, Edge, atau Safari versi terbaru.</p>' +
        '</div>';
    </script>
  </body>
</html>
